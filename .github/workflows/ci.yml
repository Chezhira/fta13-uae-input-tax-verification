name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" coverage
      - run: coverage run -m pytest -q
      - run: coverage report --include="fta13/*" --omit="fta13/ai.py" --fail-under=90
      - run: python demo.py > /dev/null

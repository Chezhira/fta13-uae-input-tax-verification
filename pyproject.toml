[project]
name = "fta13"
version = "0.1.0"
description = "Deterministic verification engine for UAE FTA Decision No. 13 of 2026 (input tax due diligence)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
app = [
    "streamlit>=1.40,<2",
    "openai>=2.24,<3",
    "pydantic>=2.8,<3",
    "supabase>=2.15,<3",
    "reportlab>=4.2,<5",
    "arabic-reshaper>=3.0,<4",
    "python-bidi>=0.6,<1",
]
dev = ["pytest>=8", "pypdf>=5,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
